name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Job: Install and Build
  build:
    name: Build all apps
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      # Step 3: Install dependencies for all apps
      - name: Install dependencies
        run: npm run install:all

      # Step 4: Lint all apps
      - name: Lint code
        run: npm run lint
        continue-on-error: true  # Don't fail if lint not configured yet

      # Step 5: Build all apps
      - name: Build all apps
        run: npm run build

  # Job: Type checking (when TypeScript is set up)
  typecheck:
    name: TypeScript type check
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm run install:all

      - name: Type check
        run: |
          cd apps/server && npm run typecheck || echo "Server typecheck not configured"
          cd ../client && npm run typecheck || echo "Client typecheck not configured"
          cd ../waiter-pwa && npm run typecheck || echo "PWA typecheck not configured"
        continue-on-error: true

  # Job: Tests
  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm run install:all

      - name: Run tests
        run: npm run test
        continue-on-error: true  # Don't fail if tests not configured yet

  # Job: Security audit
  security:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm run install:all

      - name: Audit server dependencies
        run: cd apps/server && npm audit --audit-level=moderate
        continue-on-error: true

      - name: Audit client dependencies
        run: cd apps/client && npm audit --audit-level=moderate
        continue-on-error: true

      - name: Audit PWA dependencies
        run: cd apps/waiter-pwa && npm audit --audit-level=moderate
        continue-on-error: true
